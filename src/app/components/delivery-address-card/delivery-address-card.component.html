<div class="mt-3 overflow-hidden rounded-xl" style="border: 1px solid var(--sf-border, #e5e7eb)">
  <div class="relative h-32 w-full" style="background: var(--sf-border, #e5e7eb)">
    <div #mapEl class="h-full w-full"></div>
    @if (mapFailed()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-1" style="color: var(--sf-muted, #6b7280)">
        <mat-icon class="!text-base">map</mat-icon>
        <span class="text-xs" i18n="@@storefront.deliveryAddress.mapUnavailable">Map unavailable</span>
      </div>
    }
  </div>

  <div class="flex items-start gap-2 p-3">
    <mat-icon class="!text-base" style="color: var(--sf-accent, #111827)">place</mat-icon>
    <p class="min-w-0 flex-1 text-xs" style="color: var(--sf-text, #111827)">{{ addressLabel() }}</p>
  </div>

  <div class="flex border-t" style="border-color: var(--sf-border, #e5e7eb)">
    <button
      type="button"
      class="flex flex-1 items-center justify-center gap-1.5 py-2.5 text-xs font-medium"
      style="color: var(--sf-text, #111827)"
      (click)="copyAddress()"
    >
      <mat-icon class="!text-base">{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
      @if (copied()) {
        <span i18n="@@storefront.deliveryAddress.copied">Copied</span>
      } @else {
        <span i18n="@@storefront.deliveryAddress.copy">Copy address</span>
      }
    </button>
    <a
      [href]="directionsUrl()"
      target="_blank"
      rel="noopener"
      class="flex flex-1 items-center justify-center gap-1.5 border-l py-2.5 text-xs font-medium"
      style="border-color: var(--sf-border, #e5e7eb); color: var(--sf-accent, #111827)"
    >
      <mat-icon class="!text-base">directions</mat-icon>
      <span i18n="@@storefront.deliveryAddress.directions">Get directions</span>
    </a>
  </div>
</div>
